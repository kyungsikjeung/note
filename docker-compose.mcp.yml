services:
  ksnote-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      KSNOTE_MCP_TOKEN: ${KSNOTE_MCP_TOKEN:?KSNOTE_MCP_TOKEN is required}
      KSNOTE_MCP_ALLOWED_HOSTS: ${KSNOTE_MCP_ALLOWED_HOSTS:-}
    volumes:
      - ksnote-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ksnote-data:
